version: "3.9"

services:
  jenkins:
    build:
      context: .                 # Jenkins folder
      dockerfile: Dockerfile

    container_name: jenkins
    restart: always
    user: root

    group_add:
      - 1000

    ports:
      - "8081:8080"              # Jenkins UI
      - "50000:50000"            # Agent port

    volumes:
      # Jenkins persistent storage
      - jenkins_home:/var/jenkins_home

      # Use host Docker engine
      - /var/run/docker.sock:/var/run/docker.sock

      # ----------------------------------------------------------
      #  AIRFLOW DAG MOUNT (This replaces your old absolute path)
      # ----------------------------------------------------------
      - ../fir-mlops/airflow/dags:/airflow-dags
      #       ^ Go OUT of jenkins folder
      #          then into fir-mlops/airflow/dags
      # Resulting absolute path:
      # /Volumes/Development/mechinelearning-project/fir-mlops/airflow/dags

volumes:
  jenkins_home:
